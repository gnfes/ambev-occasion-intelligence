[project]
name = "ambev-occasion-intelligence"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "lightgbm>=4.7.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytrends>=4.9.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
