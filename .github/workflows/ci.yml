name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Em PR, um push novo cancela o run anterior. Em develop/main cada commit
# mantém o próprio resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Instala só o grupo dev (ruff e pytest, travados no lock), sem o stack de
  # runtime, para o lint responder em segundos.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Lint
        run: uv run --locked --only-dev ruff check

      - name: Formatação
        run: uv run --locked --only-dev ruff format --check

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      # Os microdados da POF (2,3 GB) não ficam no git; os testes marcados com
      # `dados` rodam localmente antes do merge.
      - name: Testes
        run: uv run pytest -m "not dados" -ra
